# Git dependencies (ffx-rust) are fetched through the git CLI, with the system's git config.
[net]
git-fetch-with-cli = true

# demaster.exe runs without the Visual C++ runtime installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# demaster_live.dll (32-bit, loaded into FFX.exe) likewise.
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
