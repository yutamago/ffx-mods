# ffx-rust is private: fetch through the git CLI so its credential helper is used.
[net]
git-fetch-with-cli = true

# demaster.exe runs without the Visual C++ runtime installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# demaster_live.dll (32-bit, loaded into FFX.exe) likewise.
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
