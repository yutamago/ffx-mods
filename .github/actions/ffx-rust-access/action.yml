# SPDX-License-Identifier: MIT
# Lets cargo fetch ffx-rust (github.com/yutamago/ffx-rust, private) with the
# token in the FFX_RUST_TOKEN secret: a git URL rewrite that puts the token
# into the ffx-rust URL, and CARGO_NET_GIT_FETCH_WITH_CLI so cargo fetches
# through git (also set in .cargo/config.toml). Fails with instructions when
# the secret is missing or can't read ffx-rust (docs/ci.md).
name: ffx-rust access
description: Lets cargo fetch the private ffx-rust crates with the FFX_RUST_TOKEN secret
inputs:
  token:
    description: The FFX_RUST_TOKEN secret
    required: false
    default: ""
runs:
  using: composite
  steps:
  - name: Check FFX_RUST_TOKEN and set up git
    shell: bash
    env:
      TOKEN: ${{ inputs.token }}
    run: |
      if [ -z "$TOKEN" ]; then
        echo "::error title=FFX_RUST_TOKEN is not set::The repository secret FFX_RUST_TOKEN is missing (or not passed to this run: pull requests from forks get no secrets). cargo needs it to fetch the private ffx-rust crates. Create a fine-grained personal access token (resource owner yutamago, repository access: only yutamago/ffx-rust, permission Contents: Read-only) and add it in github.com/yutamago/ffx-demaster under Settings > Secrets and variables > Actions > New repository secret, named FFX_RUST_TOKEN. See docs/ci.md."
        exit 1
      fi
      git config --global url."https://x-access-token:${TOKEN}@github.com/yutamago/ffx-rust".insteadOf "https://github.com/yutamago/ffx-rust"
      echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      # A token that can't read ffx-rust fails here, not halfway through a build.
      if ! git ls-remote https://github.com/yutamago/ffx-rust.git HEAD > /dev/null; then
        echo "::error title=FFX_RUST_TOKEN cannot read ffx-rust::git could not read github.com/yutamago/ffx-rust with FFX_RUST_TOKEN. It must be a fine-grained personal access token with resource owner yutamago, repository access to yutamago/ffx-rust and the permission Contents: Read-only, and it must not have expired. See docs/ci.md."
        exit 1
      fi
