# SPDX-License-Identifier: MIT
# CI: builds and tests everything, and packages the release zips (one per mod, one per
# bundle: yuta.ps2-bundle) as an artifact.
#   mod        the shared library and the C# mods, and the C# tests (Linux)
#   linux      converter and live engine tests (Linux)
#   windows    demaster.exe (MSVC, static CRT) and demaster_live.dll (32-bit), the
#              release zips (tools/package/package.cs) with a check of each (what it must
#              hold, one demaster.exe at most, no game data)
# release.yml calls this workflow with the tag, so a release is built the same way.
#
# The converter's ffx-rust crates (github.com/yutamago/ffx-rust, public) come
# from git at the rev pinned in Cargo.toml; no secret is needed.
name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag (v1.2.3); sets the version of the converter and the mods
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The release tag (v1.2.3), empty outside a release: then the versions in
  # Cargo.toml and the csproj files stay.
  TAG: ${{ inputs.tag }}

jobs:
  mod:
    name: Mods (C#)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: |
        version="${TAG#v}"
        dotnet build -c Release ${version:+-p:Version="$version"} ffx-mods.slnx

    # The C# tests (tests/: fps-unlock's portable part); those that need the game skip themselves.
    - name: Test
      run: dotnet test -c Release --no-build ffx-mods.slnx

    # Debug Revival's developer tools (tools/dev/debug-revival): built only, they need the game's files to run.
    - name: Build Debug Revival's tools
      run: |
        dotnet build -c Release tools/dev/debug-revival/DisasmCheck
        dotnet build -c Release tools/dev/debug-revival/GsCheck
        for script in gen-natives gen-map-table; do dotnet build tools/dev/debug-revival/$script.cs; done

    - uses: actions/upload-artifact@v7
      with:
        name: mods
        path: artifacts/deploy/rel/mods/
        if-no-files-found: error
        retention-days: 7

  linux:
    name: Converter tests (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Test
      run: cargo test --locked -p demaster -p demaster-live

  windows:
    name: Windows build and package
    runs-on: windows-latest
    needs: mod
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

    - uses: Swatinem/rust-cache@v2

    # --target applies .cargo/config.toml's +crt-static: no Visual C++ runtime needed.
    # A release sets DEMASTER_VERSION, which the mod compares with its own version.
    - name: Build demaster.exe
      run: |
        version="${TAG#v}"
        if [ -n "$version" ]; then export DEMASTER_VERSION="$version"; fi
        cargo build --locked --release --target x86_64-pc-windows-msvc -p demaster
        cargo build --locked --release --target i686-pc-windows-msvc -p demaster-live --lib

    - name: Check demaster.exe runs
      run: |
        exe=target/x86_64-pc-windows-msvc/release/demaster.exe
        "$exe" --version
        "$exe" jobs

    - uses: actions/download-artifact@v8
      with:
        name: mods
        path: artifacts/deploy/rel/mods/

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Package
      run: |
        dotnet run tools/package/package.cs -- dist "${TAG:-ci}"

    # Every zip: the shared library, the mod with its default settings (settings.default.toml,
    # never settings.toml: that is the player's), README, licences and install script;
    # demaster.exe for the mods with PS2 files; nothing else (no efl/, build/, game data).
    - name: Check the zips
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $builds = @{ 'ps2-music-engine' = $true; 'ps2-soundtrack' = $true; 'ps2-movies' = $true; 'ps2-characters' = $true;
                     'ps2-maps' = $true; 'ps2-effects' = $true; 'ps2-lighting' = $true; 'no-hd-post-effects' = $false;
                     'ps2-interface' = $true; 'ps2-aspect-ratio' = $false; 'ps2-game-feel' = $false; 'bug-fixes' = $false;
                     'modern-minimap' = $false; 'fps-unlock' = $false; 'debug-revival' = $false }
        $noSettings = @('debug-revival')
        $bundles = @('ps2-bundle')
        $zips = @(Get-ChildItem dist -Filter '*.zip')
        if ($zips.Count -ne $builds.Count + $bundles.Count) { throw "expected $($builds.Count + $bundles.Count) zips, found $($zips.Count)" }
        foreach ($name in $builds.Keys) {
          $id = "yuta.$name"
          $zip = $zips | Where-Object { $_.Name -like "$id-*.zip" }
          if (-not $zip) { throw "no zip for $id" }
          $z = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = $z.Entries.FullName
          $z.Dispose()
          "$($zip.Name):"; $names | ForEach-Object { "  $_" }
          $need = @("mods/yuta.ffx-mods/yuta.ffx-mods.dll", "mods/yuta.ffx-mods/yuta.ffx-mods.manifest.json")
          foreach ($f in "$id.dll", "$id.manifest.json", 'README.txt', 'LICENSES.txt', 'install.cmd', 'install.ps1') { $need += "mods/$id/$f" }
          if ($noSettings -notcontains $name) { $need += "mods/$id/settings.default.toml" }
          if ($builds[$name]) { $need += "mods/$id/demaster.exe" }
          if ($name -eq 'ps2-music-engine') { $need += "mods/$id/demaster_live.dll" }
          foreach ($f in $need) { if ($names -notcontains $f) { throw "$($zip.Name) has no $f" } }
          if (-not $builds[$name] -and ($names -like '*/demaster.exe')) { throw "$($zip.Name) has demaster.exe, but $name builds nothing" }
          $bad = $names | Where-Object { ($_ -notlike "mods/$id/*" -and $_ -notlike 'mods/yuta.ffx-mods/*') -or $_ -match '/(efl|build|tools|preview|music)/|/settings\.toml$|\.(phyre|iso|bin|img|png|dds|webm|fsb|wav|vbf|bgm|wd|irx)$' }
          if ($bad) { throw "$($zip.Name) contains files it must not: $bad" }
        }
        # Every bundle: exactly the mods its manifest lists, each as in its own zip but without
        # demaster.exe; the shared library with the one demaster.exe and the installer; the
        # bundle's folder with its DLL, manifest, README, licences and the installer.
        foreach ($name in $bundles) {
          $id = "yuta.$name"
          $zip = $zips | Where-Object { $_.Name -like "$id-*.zip" }
          if (-not $zip) { throw "no zip for $id" }
          $z = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = $z.Entries.FullName
          $entry = $z.GetEntry("mods/$id/$id.manifest.json")
          if (-not $entry) { $z.Dispose(); throw "$($zip.Name) has no mods/$id/$id.manifest.json" }
          $reader = New-Object IO.StreamReader($entry.Open())
          $manifest = $reader.ReadToEnd() | ConvertFrom-Json
          $reader.Dispose(); $z.Dispose()
          "$($zip.Name):"; $names | ForEach-Object { "  $_" }
          $members = @($manifest.Dependencies | Where-Object { $_ -ne 'yuta.ffx-mods' })
          "  bundles: $($members -join ', ')"
          if ($manifest.Dependencies[0] -ne 'yuta.ffx-mods') { throw "$id's manifest does not depend on yuta.ffx-mods first" }
          if ($members.Count -eq 0) { throw "$id's manifest lists no mod" }
          $common = 'mods/yuta.ffx-mods'
          $need = @('yuta.ffx-mods.dll', 'yuta.ffx-mods.manifest.json', 'demaster.exe', 'install.cmd', 'install.ps1', 'LICENSES.txt') | ForEach-Object { "$common/$_" }
          $need += @("$id.dll", "$id.manifest.json", 'README.txt', 'LICENSES.txt', 'install.cmd', 'install.ps1') | ForEach-Object { "mods/$id/$_" }
          foreach ($m in $members) {
            if (-not $builds.ContainsKey(($m -replace '^yuta\.', ''))) { throw "$id lists $m, which is no mod" }
            foreach ($f in "$m.dll", "$m.manifest.json", 'settings.default.toml', 'README.txt', 'LICENSES.txt', 'install.cmd', 'install.ps1') { $need += "mods/$m/$f" }
            if ($m -eq 'yuta.ps2-music-engine') { $need += "mods/$m/demaster_live.dll" }
          }
          foreach ($f in $need) { if ($names -notcontains $f) { throw "$($zip.Name) has no $f" } }
          $exes = @($names | Where-Object { $_ -like '*/demaster.exe' })
          if ($exes.Count -ne 1) { throw "$($zip.Name): expected one demaster.exe, found: $exes" }
          $allowed = @('yuta.ffx-mods', $id) + $members | ForEach-Object { "mods/$_/*" }
          $bad = $names | Where-Object { $n = $_; -not ($allowed | Where-Object { $n -like $_ }) -or $n -match '/(efl|build|tools|preview|music)/|/settings\.toml$|\.(phyre|iso|bin|img|png|dds|webm|fsb|wav|vbf|bgm|wd|irx)$' }
          if ($bad) { throw "$($zip.Name) contains files it must not: $bad" }
        }

    # The installer: its settings merge, switched-off mods and load order, then the bundle's
    # install.cmd from its zip (the mods with PS2 files switched off: no disc needed). Windows
    # PowerShell 5.1 runs it for players; PowerShell 7 too.
    - name: Test the installer
      shell: pwsh
      run: |
        $zip = (Get-ChildItem dist -Filter 'yuta.ps2-bundle-*.zip').FullName
        powershell -NoProfile -ExecutionPolicy Bypass -File tools/install/install.tests.ps1 -BundleZip $zip
        if ($LASTEXITCODE -ne 0) { exit 1 }
        pwsh -NoProfile -File tools/install/install.tests.ps1
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - uses: actions/upload-artifact@v7
      with:
        name: zips
        path: dist/*.zip
        if-no-files-found: error
