# SPDX-License-Identifier: MIT
# CI: builds and tests everything, and packages the release zip as an artifact.
#   mod        the C# mod (Linux; needs no secret)
#   linux      converter tests (Linux)
#   windows    demaster.exe (MSVC, static CRT), the
#              release zip (tools/package.cs) with a check that it holds no
#              game data
# release.yml calls this workflow with the tag, so a release is built the same way.
#
# The converter depends on ffx-rust (github.com/yutamago/ffx-rust, private):
# the jobs that build Rust need the repository secret FFX_RUST_TOKEN, a
# fine-grained personal access token with read access to the contents of
# yutamago/ffx-rust (docs/ci.md). Without it they stop at "ffx-rust access"
# with a message saying so.
name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag (v1.2.3); sets the version of the converter and the mod
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The release tag (v1.2.3), empty outside a release: then the versions in
  # Cargo.toml and the csproj stay.
  TAG: ${{ inputs.tag }}

jobs:
  mod:
    name: Mod (C#)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: |
        version="${TAG#v}"
        dotnet build -c Release ${version:+-p:Version="$version"} ffx-demaster.slnx

    - uses: actions/upload-artifact@v7
      with:
        name: mod
        path: mod/artifacts/deploy/rel/mods/yuta.demaster/
        if-no-files-found: error
        retention-days: 7

  linux:
    name: Converter tests (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: ffx-rust access
      uses: ./.github/actions/ffx-rust-access
      with:
        token: ${{ secrets.FFX_RUST_TOKEN }}

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Test
      run: cargo test --locked -p demaster -p demaster-live

  windows:
    name: Windows build and package
    runs-on: windows-latest
    needs: mod
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7

    - name: ffx-rust access
      uses: ./.github/actions/ffx-rust-access
      with:
        token: ${{ secrets.FFX_RUST_TOKEN }}

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

    - uses: Swatinem/rust-cache@v2

    # --target applies .cargo/config.toml's +crt-static: no Visual C++ runtime needed.
    # A release sets DEMASTER_VERSION, which the mod compares with its own version.
    - name: Build demaster.exe
      run: |
        version="${TAG#v}"
        if [ -n "$version" ]; then export DEMASTER_VERSION="$version"; fi
        cargo build --locked --release --target x86_64-pc-windows-msvc -p demaster
        cargo build --locked --release --target i686-pc-windows-msvc -p demaster-live --lib

    - name: Check demaster.exe runs
      run: |
        exe=target/x86_64-pc-windows-msvc/release/demaster.exe
        "$exe" --version
        "$exe" jobs

    - uses: actions/download-artifact@v8
      with:
        name: mod
        path: mod/artifacts/deploy/rel/mods/yuta.demaster/

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Package
      run: |
        zip="yuta.demaster-${TAG:-ci}.zip"
        dotnet run tools/package.cs -- "$zip"
        echo "ZIP=$zip" >> "$GITHUB_ENV"

    - name: Check the zip
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [IO.Compression.ZipFile]::OpenRead("$PWD/$env:ZIP")
        $names = $zip.Entries.FullName
        $zip.Dispose()
        $names
        foreach ($f in 'yuta.demaster.dll', 'yuta.demaster.manifest.json', 'demaster.exe', 'demaster_live.dll', 'demaster.toml', 'README.txt', 'LICENSES.txt') {
          if ($names -notcontains "mods/yuta.demaster/$f") { throw "the zip has no $f" }
        }
        $bad = $names | Where-Object { $_ -notlike 'mods/yuta.demaster/*' -or $_ -match '/(efl|build|tools|preview)/|\.(phyre|iso|bin|img|png|dds|webm|fsb|wav|vbf)$' }
        if ($bad) { throw "the zip contains files it must not: $bad" }

    - uses: actions/upload-artifact@v7
      with:
        name: zip
        path: ${{ env.ZIP }}
        if-no-files-found: error
