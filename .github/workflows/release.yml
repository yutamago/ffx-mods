# SPDX-License-Identifier: MIT
# Pushing a tag such as v0.2.0 builds everything as CI does (build.yml), with
# that version in the converter and the mods, and publishes a GitHub release
# with the seven mod zips (each unpacks straight into the Fahrenheit folder). A tag with a "-" (v0.2.0-alpha) makes a prerelease.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        merge-multiple: true
        path: dist

    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        ls -l dist
        cat > notes.md <<EOF
        Seven mods for the FFX HD Remaster under Fahrenheit, one zip each: unpack the ones you
        want into your Fahrenheit folder and run \`install.cmd\` in each mod's folder
        (\`mods\\yuta.<name>\`). It adds the mod to \`mods\\loadorder\` and, for the mods with PS2
        files, builds them from your own Final Fantasy X PS2 disc (an image, or the disc in a
        drive). No game data is included. Each zip's README.txt has the details; the project
        README lists what each mod does.
        EOF
        args=(release create "$TAG" dist/*.zip
              --repo "$REPO" --verify-tag --title "FFX mods $TAG"
              --notes-file notes.md --generate-notes)
        if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
        gh "${args[@]}"
