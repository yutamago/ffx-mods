# SPDX-License-Identifier: MIT
# Pushing a tag such as v0.2.0 builds everything as CI does (build.yml), with
# that version in the converter and the mod, and publishes a GitHub release
# with the mod zip (unpacks straight into the Fahrenheit folder). A tag with a "-" (v0.2.0-alpha) makes a prerelease.
# Needs the FFX_RUST_TOKEN secret (docs/ci.md).
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        merge-multiple: true
        path: dist

    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        ls -l dist
        cat > notes.md <<EOF
        Unpack \`yuta.demaster-$TAG.zip\` into your Fahrenheit folder, set your PS2 disc image in
        \`mods\\yuta.demaster\\demaster.toml\` and run \`mods\\yuta.demaster\\demaster.exe\`.
        The zip's README.txt has the details. No game data is included: you need an image of
        your own Final Fantasy X PS2 disc and the Steam HD Remaster.
        EOF
        args=(release create "$TAG" "dist/yuta.demaster-$TAG.zip"
              --repo "$REPO" --verify-tag --title "FFX Demaster $TAG"
              --notes-file notes.md --generate-notes)
        if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
        gh "${args[@]}"
