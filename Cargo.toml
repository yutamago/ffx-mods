[workspace]
resolver = "3"
members = ["demaster", "demaster-live", "tools/dev/ps2x"]
exclude = ["tools/shotrun", "tools/calllist"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ffx-vbf = { git = "https://github.com/yutamago/ffx-rust.git", rev = "681cb391957099939fc181fae122fabca3d4917b" }
ffx-phyre = { git = "https://github.com/yutamago/ffx-rust.git", rev = "681cb391957099939fc181fae122fabca3d4917b" }
ffx-script = { git = "https://github.com/yutamago/ffx-rust.git", rev = "681cb391957099939fc181fae122fabca3d4917b" }
ffx-dxbc = { git = "https://github.com/yutamago/ffx-rust.git", rev = "681cb391957099939fc181fae122fabca3d4917b" }

[profile.release]
opt-level = 3
