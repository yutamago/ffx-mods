# FFX Demaster settings.
#
# After changing anything here: run `demaster.exe build` again, then restart
# the game. (Fahrenheit picks up the mod's files only when the game starts.)
#
# Presentation settings are "ps2" (the PS2 original, the default) or "hd" (the
# HD Remaster). Fixes are true (fixed, the default) or false (as on PC).
# Game logic always stays the PC's. Not every setting does something yet;
# `demaster.exe build` lists the ones that don't. docs/config.md describes
# each one.
#
# Windows paths: use single quotes, 'C:\Games\FFX.iso' (in double quotes a
# backslash starts an escape), or forward slashes.

# Movies (FMVs) in their PS2 4:3 version with the PS2 audio.
movies = "ps2"

[source]
# Your own PS2 disc image of Final Fantasy X (any region). Required.
iso = ''
# The game folder, the one with FFX.exe and data\FFX_Data.vbf. Leave empty to
# look in the usual Steam folders.
game = ''

[build]
# The mod folder the PS2 files are written to. Leave empty for the folder
# demaster.exe is in (mods\yuta.demaster).
mod_dir = ''

[models]
# Tidus, Yuna and the rest of the party: the PS2 meshes and textures.
party = "ps2"
# NPCs.
npc = "ps2"
# Monsters and bosses.
monster = "ps2"
# Aeons.
aeon = "ps2"
# Weapons.
weapon = "ps2"
# Objects (chests, save spheres, vehicles and other props).
object = "ps2"

[maps]
# Field map textures.
field = "ps2"
# Field map geometry where the HD version changed it (not planned yet).
geometry = "ps2"
# The painted 2D backgrounds of fixed-camera rooms (4:3).
backgrounds = "ps2"
# Battle map textures.
battle = "ps2"

[effects]
# Spell, summon and effect textures.
textures = "ps2"

[render]
# "ps2": no glow/blow-out. "hd": the HD Remaster's glow.
glow = "ps2"
# "ps2": characters lit by the PS2 light colours and directions (no HD
# intensity boost). "hd": the HD Remaster's character lighting.
lighting = "ps2"
# "ps2": a soft ground shadow under each character, no shadow maps. "hd": shadow maps.
shadows = "ps2"
# "ps2": 4:3 with black bars. "hd": 16:9.
aspect = "ps2"
# "game": the game's own texture filter. "nearest": unfiltered pixels.
texture_filter = "game"

[ui]
# Menus, cursor and windows drawn the PS2 way (the PC-only screens such as
# the Esc menu and save/load stay HD).
menus = "ps2"
# Character portraits and icons.
portraits = "ps2"
# The PS2 font.
font = "ps2"
# The plain title logo instead of "HD Remaster".
title = "ps2"
# "ps2": no loading screen and no splash videos.
loading = "ps2"
# Subtitles for battle dialogue, as in the PS2 International version.
battle_subtitles = "ps2"
# "ps2": the battle menu reacts at once (the PC adds 0.2-0.45 s delays).
battle_menu_delay = "ps2"
# PS2 button glyphs instead of the Xbox-style ones.
button_glyphs = "ps2"

[audio]
# "ps2": the original soundtrack. "hd": the arranged one.
soundtrack = "ps2"

[fixes]
# NPC mouths that hang open in some cutscenes.
npc_mouths = true
# The Farplane background video that never plays on PC.
farplane_video = true
# Lulu's Fury spins that often aren't registered.
lulu_fury = true
